[workspace]
name = "pinocchio_rs"
version = "0.0.1"
description = "Rust bindings to the Pinocchio C++ rigid body dynamics library."
authors = ["pinocchio_rs contributors"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# Native C++ dependencies. The Rust crates locate Pinocchio + Eigen + urdfdom
# via pkg-config (`pinocchio.pc`) — the build script does NOT call CMake.
[dependencies]
pinocchio = ">=3.2,<4"
eigen = ">=3.4"
urdfdom = ">=3"
cmake = ">=3.20"
pkg-config = "*"
cxx-compiler = "*"
make = "*"

# Rust toolchain — vendoring it through pixi means contributors don't have to
# bring their own rustc, and CI matches local exactly.
[dependencies.rust]
version = ">=1.75"

[target.linux-64.dependencies]
sysroot_linux-64 = "*"

[tasks]
# Cargo passthrough — `pixi run cargo ...` works from any clean clone.
cargo = "cargo"

# Single command builds the C++ oracle and emits goldens (see §13 of tasks.md).
gen-goldens = { cmd = "bash scripts/gen-goldens.sh" }

# Build / test convenience aliases.
build = "cargo build --workspace"
test = "cargo test --workspace"
check-env = "bash scripts/check-env.sh"
