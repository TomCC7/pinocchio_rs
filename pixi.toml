[workspace]
name = "pinocchio_rs"
version = "0.0.1"
description = "Rust bindings to the Pinocchio C++ rigid body dynamics library."
authors = ["pinocchio_rs contributors"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# Native C++ dependencies. The Rust crates locate Pinocchio + Eigen + urdfdom
# via pkg-config (`pinocchio.pc`) — the build script does NOT call CMake.
[dependencies]
pinocchio = ">=3.2,<4"
eigen = ">=3.4"
urdfdom = ">=3"
cmake = ">=3.20"
pkg-config = "*"
cxx-compiler = "*"
make = "*"

# Rust toolchain — vendoring it through pixi means contributors don't have to
# bring their own rustc, and CI matches local exactly.
[dependencies.rust]
version = ">=1.75"

[target.linux-64.dependencies]
sysroot_linux-64 = "*"

[tasks]
# Cargo passthrough — `pixi run cargo ...` works from any clean clone.
# Inside `pixi run`, PKG_CONFIG_PATH is already pinned to the pixi env so
# the passthrough's first-probe succeeds against the pixi-managed Pinocchio
# without needing the `bundled-pixi` feature flag explicitly.
cargo = "cargo"

# Single command builds the C++ oracle and emits goldens (see §13 of tasks.md).
gen-goldens = { cmd = "bash scripts/gen-goldens.sh" }
# Reproducibility check used by CI. Both this task and the script invoke
# `cmake` and the freshly built `gen_goldens` binary, which need the pixi
# env's pkg-config search path and dynamic linker hints — running it via
# `pixi run` (or this task) is the supported entrypoint.
test-goldens-reproducible = { cmd = "bash scripts/test-goldens-reproducible.sh" }

# Build / test convenience aliases. These pin `--features pinocchio-sys/bundled-pixi`
# so that even when a contributor has a stale system Pinocchio also discoverable
# via PKG_CONFIG_PATH, the pixi-managed copy still wins discovery (matches
# design DD7).
build = "cargo build --workspace --features pinocchio-sys/bundled-pixi"
test = "cargo test --workspace --features pinocchio-sys/bundled-pixi"
check-env = "bash scripts/check-env.sh"
