[package]
name = "pinocchio-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Safe Rust bindings to the Pinocchio C++ rigid body dynamics library."

[lib]
path = "src/lib.rs"

[dependencies]
pinocchio-sys = { path = "../pinocchio-sys", version = "0.0.1" }
cxx = { workspace = true }
nalgebra = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
