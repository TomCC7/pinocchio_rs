name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.67.2
          cache: true

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'pixi.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-

      - name: GATE.1 — env discovery
        run: |
          pixi install
          pixi run check-env
          pixi run cargo check --workspace

      - name: GATE.2 — pinocchio-sys FFI
        run: pixi run cargo test -p pinocchio-sys

      - name: GATE.3 / GATE.4 / GATE.5–12 — safe wrappers
        run: pixi run cargo test -p pinocchio-rs --lib

      - name: GATE.11 — IK convergence
        run: pixi run cargo test -p pinocchio-rs --test ik_convergence

      - name: Examples
        run: |
          for ex in overview_simple overview_urdf overview_se3 overview_lie \
                    inverse_dynamics inverse_kinematics kinematics_derivatives; do
            pixi run cargo run --example "$ex"
          done

      - name: GATE.13 — golden reproducibility
        run: bash scripts/test-goldens-reproducible.sh

      - name: GATE.14 — full parity suite
        run: pixi run cargo test -p pinocchio-rs --tests

      - name: GATE.4d — compile-fail
        run: pixi run cargo test -p pinocchio-rs --test compile_fail

      - name: GATE.15 — rustdoc warning-free
        run: pixi run cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
